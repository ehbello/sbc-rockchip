name: arm-trusted-firmware-rk3399
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/ARM-software/arm-trusted-firmware/archive/{{ .arm_trusted_firmware_version }}.tar.gz
        destination: arm-trusted-firmware.tar.gz
        sha256: "{{ .arm_trusted_firmware_sha256 }}"
        sha512: "{{ .arm_trusted_firmware_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        tar xf arm-trusted-firmware.tar.gz --strip-components=1

        patch -p0 < /pkg/patches/platform.mk.patch
    # rk3399
    build:
      - |
        # https://github.com/ARM-software/arm-trusted-firmware/blob/master/docs/getting_started/initial-build.rst
        export CROSS_COMPILE=/bin/aarch64-linux-musl-

        # TF-A appends $(CFLAGS)/$(CPPFLAGS) after its own -Os, so the build environment
        # defaults (-O2) would win and inflate .pmusram past its 8K limit on rk3399
        unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS

        make realclean

        mkdir -p $(pwd)/build/rk3399/release/
        cp -r /pkg/m0 $(pwd)/build/rk3399/release/

        # SPD=opteed links the OP-TEE Secure Payload Dispatcher into BL31: it
        # initializes the secure payload at boot and routes every normal-world
        # OP-TEE SMC into it, saving and restoring the two worlds' contexts
        # around the switch. Without it the OP-TEE SMC function IDs return
        # "unknown SMC" and u-boot's OP-TEE driver never probes.
        #
        # This BL31 is shared by every rockpi4c u-boot variant, but only the
        # opt-in rockpi4c-ftpm one packs OP-TEE as BL32 (see
        # artifacts/rockpi4c/u-boot/pkg.yaml). On the variants that do not, the
        # dispatcher finds no secure payload, says so and the board boots
        # normally:
        #   WARNING: No OPTEE provided by BL2 boot loader, Booting device
        #     without OPTEE initialization. SMC`s destined for OPTEE will
        #     return SMC_UNK
        #   ERROR:   Error initializing runtime service opteed_fast
        # That is the whole visible effect on them, and it is expected output
        # rather than a fault to chase.
        make -j $(nproc) PLAT=rk3399 DEBUG=0 bl31 \
          LOG_LEVEL=30 \
          EVENT_LOG_LEVEL=10 \
          MEASURED_BOOT=1 \
          TRUSTED_BOARD_BOOT=1 \
          SPD=opteed
    install:
      - |
        mkdir -p /rootfs/arm-trusted-firmware/rk3399

        cp build/rk3399/release/bl31/bl31.elf /rootfs/arm-trusted-firmware/rk3399/bl31.elf
finalize:
  - from: /rootfs
    to: /libs
