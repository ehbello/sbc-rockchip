name: radxa-overlays
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://cdn.kernel.org/pub/linux/kernel/v{{ regexReplaceAll ".\\d+\\.\\d+$" .linux_version "${1}" }}.x/linux-{{ .linux_version }}.tar.xz
        destination: linux.tar.xz
        sha256: "{{ .linux_sha256 }}"
        sha512: "{{ .linux_sha512 }}"
      - url: https://github.com/radxa-pkg/radxa-overlays/archive/refs/tags/{{ .radxa_overlays_version }}.tar.gz
        destination: radxa-overlays.tar.gz
        sha256: "{{ .radxa_overlays_sha256 }}"
        sha512: "{{ .radxa_overlays_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    network: default
    prepare:
      - |
        tar -xJf linux.tar.xz --strip-components=1
        rm linux.tar.xz
      - |
        tar xf radxa-overlays.tar.gz --strip-components=1
        rm radxa-overlays.tar.gz
    build:
      # radxa-overlays >= 0.2.x dropped the standalone `build-dtbo` make target
      # (overlays are now built via the kernel Kbuild / DKMS packaging). Compile
      # the declared rockchip overlays directly instead: the base kernel headers
      # provide the <dt-bindings/...> includes, quoted includes resolve relative
      # to the overlay dir, and -@ keeps the symbols fdtoverlay needs.
      - |
        ovl=arch/arm64/boot/dts/rockchip/overlays
        for dtbo in $(grep -hoE '[a-z0-9._-]+\.dtbo' ${ovl}/Makefile | sort -u); do
          dts="${ovl}/${dtbo%.dtbo}.dts"
          [ -f "${dts}" ] || continue
          # A single overlay needing a binding absent from this kernel must not
          # break the whole set (651+ overlays across rk33xx..rk3588); warn and
          # skip, keeping the buildable ones (incl. the ones we select).
          if ! cpp -nostdinc -undef -x assembler-with-cpp -E -I include "${dts}" "${dts}.tmp" 2>/dev/null \
             || ! dtc -@ -I dts -O dtb -o "${ovl}/${dtbo}" "${dts}.tmp" 2>/dev/null; then
            echo "WARN: skipping overlay ${dtbo} (failed to build)"
            rm -f "${ovl}/${dtbo}"
          fi
        done
    install:
      - |
        for dtbo in $(find arch/arm64/boot/dts -name "*.dtbo" -printf "%P\n"); do
          mkdir -p /rootfs/artifacts/arm64/dtb/$(dirname ${dtbo})
          cp arch/arm64/boot/dts/${dtbo} /rootfs/artifacts/arm64/dtb/${dtbo}
        done
finalize:
  - from: /rootfs
    to: /rootfs
