# EFI boot services + UEFI SecureBoot + EFI variable runtime
CONFIG_EFI_LOADER=y
CONFIG_BOOTM_EFI=y
CONFIG_CMD_BOOTEFI=y
CONFIG_CMD_EFICONFIG=y
CONFIG_EFI_SECURE_BOOT=y
CONFIG_EFI_VAR_BUF_SIZE=65536

# Room in the image for a UEFI variable store, so Secure Boot keys can be put
# there when the image is built. This is the only way they can be: u-boot drops
# PK, KEK, db and dbx when it reads the store back from the EFI system partition
# ("Secure boot related and volatile variables shall only be restored from
# U-Boot's preseed" -- efi_var_restore()), so a key enrolled at runtime is gone
# by the next boot and EFI_SECURE_BOOT enforces nothing without one.
#
# The package builds an empty store to fill this: with no keys the platform
# stays in setup mode and boots what it boots today. The file is sized with slack
# so the installer can write a real store into it without moving anything.
CONFIG_EFI_VARIABLES_PRESEED=y
CONFIG_EFI_VAR_SEED_FILE="ubootefi.var"
CONFIG_CMD_NVEDIT_EFI=y
CONFIG_CMD_EFIDEBUG=y
