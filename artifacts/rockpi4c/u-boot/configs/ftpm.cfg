# Firmware TPM 2.0 (Microsoft's ms-tpm-20-ref as an OP-TEE trusted application)
# + TPM2 stack + TCG2 event log for measured boot.
#
# u-boot must see a TPM before it will expose EFI_TCG2_PROTOCOL, which is what
# systemd-stub uses to measure the UKI into PCR 11 -- the PCR Talos seals disk
# encryption keys to. Here that TPM is the fTPM: CONFIG_TPM2_FTPM_TEE opens a
# session to the TA (UUID bc50d971-..., linked into tee.bin as an early TA) over
# the OP-TEE client from optee.cfg, and binds to the /tpm node that
# patches/uboot-dts-optee-ftpm-nodes.patch adds.
#
# The generic TPM2/TCG2/hash block below is deliberately repeated from tpm.cfg:
# the two files are alternative TPM transports, never merged together, and each
# has to stand on its own over the board defconfig.
CONFIG_TPM=y
CONFIG_TPM_V2=y
CONFIG_TPM_RNG=y
CONFIG_TPM2_FTPM_TEE=y
CONFIG_CMD_TPM=y
CONFIG_CMD_TPM_V2=y
CONFIG_EFI_TCG2_PROTOCOL=y
CONFIG_EFI_TCG2_PROTOCOL_EVENTLOG_SIZE=65536

# Hashing used by measured boot / TCG2
CONFIG_CMD_HASH=y
CONFIG_HASH_VERIFY=y
CONFIG_SHA384=y
CONFIG_SHA512=y
CONFIG_SMBIOS_PARSER=y
