# OP-TEE: let u-boot talk to the secure world.
#
# TEE + OPTEE give u-boot the driver-model TEE client that binds to the
# /firmware/optee node (see patches/uboot-dts-optee-ftpm-nodes.patch); every
# other OP-TEE-backed feature in this build -- the fTPM, RPMB secure storage --
# is a client of it.
CONFIG_TEE=y
CONFIG_OPTEE=y
CONFIG_OPTEE_LIB=y

# Pass the OP-TEE node (and any reserved-memory it declares) on to the OS when
# u-boot boots a non-EFI image.
CONFIG_BOOTM_OPTEE=y

# Entropy from the secure world, in addition to the SMCCC TRNG in common.cfg.
CONFIG_RNG_OPTEE=y
