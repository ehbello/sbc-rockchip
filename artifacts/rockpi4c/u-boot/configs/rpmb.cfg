# eMMC RPMB secure storage, reached through OP-TEE.
#
# RPMB is the only storage on this board with replay protection: every access is
# authenticated with a MAC over a monotonic write counter, so the normal world
# cannot roll back what is stored there by restoring an old copy. That is what
# makes it the right home for the fTPM's NV state, which is why OP-TEE is built
# with CFG_RPMB_FS=y and CFG_REE_FS=n.
#
# OP-TEE has no eMMC driver of its own -- it asks the normal world to perform the
# RPMB frames on its behalf -- so u-boot needs the support below to service those
# requests before Linux and tee-supplicant exist.
CONFIG_SUPPORT_EMMC_RPMB=y
CONFIG_CMD_MMC_RPMB=y
CONFIG_CMD_OPTEE_RPMB=y

# Keeping the UEFI variables in the secure world instead, in RPMB behind OP-TEE's
# StandaloneMM partition, is not available here on two counts:
#
#   - u-boot cannot open a session to that partition. It fails with "Unable to
#     open OP-TEE session (err=-5)", then "mm_communicate failed", then "Cannot
#     initialize UEFI sub-system" -- and with UEFI dead the board does not boot,
#     so this is off rather than enabled and broken;
#
#   - it excludes the store the Secure Boot keys come from. Those are pre-seeded
#     into the image (see efi.cfg) and CONFIG_EFI_VARIABLES_PRESEED depends on
#     !EFI_MM_COMM_TEE, so enabling this would take them away.
# CONFIG_EFI_MM_COMM_TEE is not set
