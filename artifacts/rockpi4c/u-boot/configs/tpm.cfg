# SPI TPM 2.0 (TIS) + TPM2 stack + TCG2 eventlog for measured boot.
# u-boot must see the TPM so it exposes EFI_TCG2_PROTOCOL, which systemd-stub
# uses to measure the UKI into PCR 11 (the PCR Talos seals disk keys to).
#
# The TPM is driven over soft-SPI (bit-banged GPIO): the rk3399 native spi1 CS
# is claimed by hardware and the hardware SPI controller is unsuitable for a TPM
# here. SOFT_SPI is a stock u-boot driver; the bus is defined in the DTB.
CONFIG_TPM=y
CONFIG_TPM_V2=y
CONFIG_TPM_RNG=y
CONFIG_TPM2_TIS_SPI=y
CONFIG_SOFT_SPI=y

# The TPM shares the spi1 pins with the SPI-NOR flash (disabled in this variant),
# so SPI-NOR boot is unavailable and the SPL boots from eMMC/SD. Dropping SPL_SPI
# also keeps drivers/spi -- including soft_spi, which needs DM_GPIO that the SPL
# lacks -- out of the SPL build.
# CONFIG_SPL_SPI is not set
# CONFIG_SPL_SPI_LOAD is not set
# CONFIG_SPL_SPI_FLASH_SUPPORT is not set
# CONFIG_ROCKCHIP_SPI_IMAGE is not set
CONFIG_CMD_TPM=y
CONFIG_CMD_TPM_V2=y
CONFIG_EFI_TCG2_PROTOCOL=y
CONFIG_EFI_TCG2_PROTOCOL_EVENTLOG_SIZE=65536

# Hashing used by measured boot / TCG2
CONFIG_CMD_HASH=y
CONFIG_HASH_VERIFY=y
CONFIG_SHA384=y
CONFIG_SHA512=y
CONFIG_SMBIOS_PARSER=y
