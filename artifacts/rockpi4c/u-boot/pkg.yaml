# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-rockpi4c
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-rk3399
steps:
  - sources:
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_version }}.tar.bz2
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        tar xf u-boot.tar.bz2 --strip-components=1
      - |
        # mkimage has to run where the installer runs, and the imager that runs
        # it ships no shell -- mkimage asks one to copy the FIT before rebuilding
        # it, which fails there with a message naming cp. The patch replaces that
        # with copyfile(), which the same directory already provides. Sent
        # upstream; drop this once it lands.
        #
        # It goes in prepare rather than per variant because `make mrproper` does
        # not revert patches, so applying it once covers every variant.
        patch -p1 --fuzz=0 < /pkg/patches/uboot-mkimage-copy-in-process.patch
    build:
      # Two variants are built from the same source:
      #   rockpi4c      -- default: SPI-NOR flash boot, no TPM (flash preserved);
      #   rockpi4c-spi-tpm  -- soft-SPI external TPM (enables measured boot),
      #                        no SPI-NOR flash.
      # The installer picks one via the `uBootVariant` overlay option. Kernel
      # device tree overlays describing what the firmware changes live under
      # overlays/common/ (every variant) and overlays/<variant>/; the last step
      # compiles them into each variant's artifacts overlays/ directory, which
      # the imager merges into the measured UKI DTB so u-boot and the kernel agree.
      #
      # Besides the packed boot images, each variant publishes the pieces they are
      # packed from -- the TPL, the SPL with its control device tree, and the FIT.
      # That is what lets the installer put a public key in the SPL device tree,
      # sign the FIT with the matching private half and pack the result again, so
      # the SPL will only load the FIT it was written to the disk with. Signing
      # there rather than here keeps this build reproducible: a key generated in
      # CI would make every run of the same commit publish different bytes.
      - |
        # Variant 1: default (keeps the SPI-NOR flash + SPI boot).
        scripts/kconfig/merge_config.sh configs/rock-pi-4c-rk3399_defconfig \
          /pkg/configs/common.cfg \
          /pkg/configs/board.cfg \
          /pkg/configs/efi.cfg

        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" \
            BL31=/libs/arm-trusted-firmware/rk3399/bl31.elf

        mkdir -p /rootfs/artifacts/arm64/u-boot/rockpi4c
        cp -v -t /rootfs/artifacts/arm64/u-boot/rockpi4c \
          u-boot-rockchip.bin u-boot-rockchip-spi.bin \
          u-boot.itb tpl/u-boot-tpl.bin spl/u-boot-spl.bin spl/u-boot-spl.dtb

        # The host tools the installer signs with, from the same source tree as
        # the firmware they operate on: fdt_add_pubkey puts the public key in the
        # SPL device tree, mkimage signs the FIT and rebuilds the Rockchip ID
        # block, fit_check_sign is the verifier the SPL itself runs. Both variants
        # are built from this tree, so the tools are shipped once for the board.
        mkdir -p /rootfs/artifacts/arm64/u-boot-tools/rockpi4c
        cp -v -t /rootfs/artifacts/arm64/u-boot-tools/rockpi4c \
          tools/mkimage tools/fdt_add_pubkey tools/fit_check_sign
      - |
        # Variant 2: TPM (soft-SPI measured boot; spi1/SPL_SPI disabled -> no
        # SPI-NOR boot, and no u-boot-rockchip-spi.bin).
        make mrproper
        patch -p1 < /pkg/patches/uboot-dts-tpm-softspi.patch

        scripts/kconfig/merge_config.sh configs/rock-pi-4c-rk3399_defconfig \
          /pkg/configs/common.cfg \
          /pkg/configs/board.cfg \
          /pkg/configs/efi.cfg \
          /pkg/configs/measured-boot.cfg \
          /pkg/configs/tpm.cfg

        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" \
            BL31=/libs/arm-trusted-firmware/rk3399/bl31.elf

        mkdir -p /rootfs/artifacts/arm64/u-boot/rockpi4c-spi-tpm
        cp -v -t /rootfs/artifacts/arm64/u-boot/rockpi4c-spi-tpm \
          u-boot-rockchip.bin \
          u-boot.itb tpl/u-boot-tpl.bin spl/u-boot-spl.bin spl/u-boot-spl.dtb
      - |
        # Kernel overlays: every .dtso under overlays/common/ and overlays/<variant>/
        # is compiled into that variant's overlays/ artifacts directory. Raw pin
        # numbers only, no cpp includes; -@ keeps symbols for fdtoverlay.
        #
        # The directory is created even when a variant has no overlays: the
        # installer always points the imager at it and the imager stats the path,
        # failing the build if it is absent.
        for variant in rockpi4c rockpi4c-spi-tpm; do
          out=/rootfs/artifacts/arm64/u-boot/${variant}/overlays
          mkdir -p "${out}"
          for src in /pkg/overlays/common/*.dtso /pkg/overlays/${variant}/*.dtso; do
            [ -e "${src}" ] || continue
            dtc -@ -I dts -O dtb -o "${out}/$(basename "${src%.dtso}").dtbo" "${src}"
          done
        done
finalize:
  - from: /rootfs
    to: /rootfs
